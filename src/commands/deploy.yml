parameters:
  host-domain:
    type: string
  ssh-port:
    type: integer
    default: 22
  architecture:
    type: string
    default: ""
    description: >
      Architecture tag used when pulling architecture-specific images
      (e.g. "amd64", "arm64", "armv7l"). Leave empty for services using
      multi-platform manifests — Docker will resolve the correct platform
      automatically.
steps:
  - run:
      name: Set host domain
      command: echo "Deploying onto host \"<< parameters.host-domain >>\""
  - checkout
  - run:
      name: Determine deployed version from git tags
      command: |
        git fetch --tags
        VERSION=$(git tag --list 'v*' --sort=-v:refname | head -1 | sed 's/^v//')
        if [ -z "$VERSION" ]; then
          VERSION="unknown"
        fi
        echo "Deploying version: $VERSION"
        echo "export VERSION=$VERSION" >> "$BASH_ENV"
  - add_ssh_keys:
      fingerprints:
        - "b7:75:7e:64:66:44:40:06:95:b4:ad:cd:07:a7:6f:08"
  - run:
      name: Populate known_hosts
      command: |
        ssh-keyscan -p << parameters.ssh-port >> -H << parameters.host-domain >> >> ~/.ssh/known_hosts
        # Only scan creds.l42.eu if we'll actually need to connect to it.
        # Skip if the production envfile is pre-supplied via LUCOS_DEPLOY_ENV_BASE64
        # (e.g. for self-deploying services like lucos_creds). In that case the
        # infrastructure credentials SCP is non-fatal, so no host key needed.
        if [ -z "$LUCOS_DEPLOY_ENV_BASE64" ]; then
          ssh-keyscan -p 2202 -H creds.l42.eu >> ~/.ssh/known_hosts
        fi
      max_auto_reruns: 5
      auto_rerun_delay: 30s
  - run:
      name: Fetch production envfile
      command: |
        if [ -n "$LUCOS_DEPLOY_ENV_BASE64" ]; then
          echo "Using pre-supplied production envfile from LUCOS_DEPLOY_ENV_BASE64"
          printf '%s' "$LUCOS_DEPLOY_ENV_BASE64" | base64 -d > .env
        else
          scp -s -P 2202 -o BatchMode=yes docker-deploy@creds.l42.eu:$CIRCLE_PROJECT_REPONAME/production/.env .
        fi
      max_auto_reruns: 5
      auto_rerun_delay: 30s
  - run:
      name: Validate envfile contains PORT (if required)
      command: |
        if grep -qE '\$\{?PORT\}?' docker-compose.y*ml; then
          PORT_VALUE=$(grep -E '^PORT=' .env | cut -d= -f2)
          if [ -z "$PORT_VALUE" ]; then
            echo "ERROR: PORT is referenced in docker-compose.yml but not set in .env — aborting deploy"
            exit 1
          fi
        fi
  - run:
      name: Pull container(s) onto remote box

      # HACK: Not specifying a service should pull all services
      # However, this is failing in docker compose v2.10.2 in a difficult-to-debug manner
      # As a workaround, enumerate the services and pull each one-by-one.
      #
      # Use `docker compose config --services` (not `yq` over the raw file) so the list
      # respects compose profiles. A service gated behind a profile — e.g. a `test` service
      # that builds a separate image which is deliberately never pushed to the registry — is
      # excluded, matching the publish step (publish-docker.yml) which also enumerates via
      # `docker compose config`. Pulling such a service by name bypasses the profile gate and
      # fails with "pull access denied" (exit 18), because the image was never published.
      command: |
        docker compose config --services | while read service
        do
          DOCKER_HOST="ssh://docker-deploy@<< parameters.host-domain >>:<< parameters.ssh-port >>" \
          ARCH=<< parameters.architecture >> \
          docker compose pull $service
        done
  - run:
      name: Fetch deploy infrastructure credentials
      command: |
        # KEY_LUCOS_MONITORING is normally provided by this SCP (from lucos_deploy_orb/deploy/.env
        # on creds.l42.eu). The pre-set check allows it to be supplied as a CircleCI project
        # env var instead, bypassing the SCP (useful for services that cannot connect to
        # creds.l42.eu during their own deploy).
        if [ -n "$KEY_LUCOS_MONITORING" ]; then
          echo "KEY_LUCOS_MONITORING already set — skipping infrastructure credential fetch from creds.l42.eu"
        else
          TMPFILE=$(mktemp)
          trap 'rm -f "$TMPFILE"' EXIT
          if scp -s -P 2202 -o BatchMode=yes \
               docker-deploy@creds.l42.eu:lucos_deploy_orb/deploy/.env "$TMPFILE"; then
            cat "$TMPFILE" >> "$BASH_ENV"
          else
            echo "WARNING: could not fetch deploy infrastructure credentials from creds.l42.eu — monitoring suppression will be skipped"
          fi
        fi
  - run:
      name: Suppress monitoring alerts during deploy
      command: |
        curl -X PUT https://monitoring.l42.eu/suppress/$CIRCLE_PROJECT_REPONAME \
          -H "Authorization: Bearer $KEY_LUCOS_MONITORING" \
          --max-time 5 || true
  - run:
      name: Export deploy target environment
      command: |
        echo "export DOCKER_HOST=ssh://docker-deploy@<< parameters.host-domain >>:<< parameters.ssh-port >>" >> "$BASH_ENV"
        echo "export COMPOSE_PROJECT_NAME=$CIRCLE_PROJECT_REPONAME" >> "$BASH_ENV"
        echo "export ARCH=<< parameters.architecture >>" >> "$BASH_ENV"
        echo "export PRODUCTION=true" >> "$BASH_ENV"
        echo "export HOSTDOMAIN=<< parameters.host-domain >>" >> "$BASH_ENV"
  - deploy-compose
  - run:
      name: Prune unused Docker images
      command: |
        docker image prune -f || true
  - run:
      name: Delete envfile
      command: |
        rm -f .env
  - run:
      name: Send deploy log to loganne
      # Loganne often fails to respond in time if it itself (or lucos_router) has just been
      # deployed and hasn't yet finished starting up.  On fail, wait 30 secs and try again.
      # Runs even after a failed deploy (DEPLOY_SUCCEEDED=false) — a silently-skipped log
      # entry would leave no trace of the attempted version in the feed; deployRollback
      # (fired from deploy-compose when a rollback happens) covers the rollback outcome
      # itself, this event covers "this version was attempted" regardless of outcome.
      command: |
        if [ "$DEPLOY_SUCCEEDED" = "true" ]; then
          HUMAN_READABLE="Deployed $CIRCLE_PROJECT_REPONAME v$VERSION to << parameters.host-domain >>"
        else
          HUMAN_READABLE="Deploy of $CIRCLE_PROJECT_REPONAME v$VERSION to << parameters.host-domain >> FAILED"
        fi
        curl https://loganne.l42.eu/events --data '{
          "type":"deploySystem",
          "source":"lucos_deploy_orb",
          "systemDeployed":"'"$CIRCLE_PROJECT_REPONAME"'",
          "deployTarget":"<< parameters.host-domain >>",
          "sshPort":"<< parameters.ssh-port >>",
          "humanReadable":"'"$HUMAN_READABLE"'",
          "version":"'"$VERSION"'",
          "deploySucceeded":'"${DEPLOY_SUCCEEDED:-true}"'
        }' -H "Content-Type: application/json" --fail
      max_auto_reruns: 5
      auto_rerun_delay: 30s
  - run:
      name: Fail job if deploy did not succeed
      command: |
        if [ "$DEPLOY_SUCCEEDED" != "true" ]; then
          echo "Deploy of v$VERSION did not succeed — failing the job (even if a rollback above restored the previous version)."
          exit 1
        fi
