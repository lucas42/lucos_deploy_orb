version: 2.1

orbs:
  deploy: lucos/deploy@dev:alpha
  orb-tools: circleci/orb-tools@10.0

jobs:
  test-publish-docker:
    docker:
      - image: cimg/base:current
    steps:
      - run:
          name: Create test Dockerfile and docker-compose.yml
          command: |
            cat > Dockerfile \<< 'EOF'
            FROM alpine:latest
            ARG VERSION=dev
            LABEL org.opencontainers.image.version="$VERSION"
            EOF
            cat > docker-compose.yml \<< 'EOF'
            services:
              test-image:
                build:
                  context: .
                image: lucas42/deploy-orb-test:${VERSION}
            EOF
      - deploy/fetch-publish-creds
      - run:
          name: Set test image version
          command: echo "export VERSION=v${CIRCLE_PIPELINE_ID}" >> $BASH_ENV
      - deploy/publish-docker
      - run:
          name: Verify versioned tag was pushed
          command: |
            source $BASH_ENV
            docker buildx imagetools inspect lucas42/deploy-orb-test:${VERSION}
      - run:
          name: Assert plain manifest for default platform="" build (regression check for lucos_deploy_orb#186)
          command: |
            source $BASH_ENV
            docker buildx imagetools inspect lucas42/deploy-orb-test:${VERSION} --raw \
              | jq -e '.mediaType == "application/vnd.docker.distribution.manifest.v2+json"'
      - run:
          name: Verify :latest tag was pushed (main branch only)
          command: |
            if [ "$CIRCLE_BRANCH" != "main" ]; then
              echo "Not on main — skipping :latest verification"
              exit 0
            fi
            source $BASH_ENV
            docker buildx imagetools inspect lucas42/deploy-orb-test:latest

  test-publish-docker-with-mirror:
    machine:
      image: ubuntu-2204:current
    steps:
      - run:
          name: Start mirror registry with authentication (simulates docker.l42.eu 401 response)
          command: |
            mkdir -p /tmp/mirror-auth
            docker run --rm --entrypoint htpasswd httpd:2 -Bbn testmirror testpassword > /tmp/mirror-auth/htpasswd
            docker run -d \
              --name mirror-registry \
              -v /tmp/mirror-auth:/auth \
              -e REGISTRY_AUTH=htpasswd \
              -e "REGISTRY_AUTH_HTPASSWD_REALM=Registry Realm" \
              -e REGISTRY_AUTH_HTPASSWD_PATH=/auth/htpasswd \
              -p 5001:5000 \
              registry:2
      - run:
          name: Wait for mirror registry to return 401
          command: |
            for i in {1..30}; do
              HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5001/v2/ || echo "000")
              if [ "$HTTP_CODE" = "401" ]; then
                echo "Mirror registry is up and returning 401 (as expected for an authenticated registry)"
                break
              fi
              sleep 1
            done
            if [ "$HTTP_CODE" != "401" ]; then
              echo "Mirror registry did not start properly (got '$HTTP_CODE', expected '401')"
              exit 1
            fi
      - run:
          name: Create test Dockerfile and docker-compose.yml
          command: |
            cat > Dockerfile \<< 'EOF'
            FROM scratch
            ARG VERSION=dev
            LABEL org.opencontainers.image.version="$VERSION"
            EOF
            cat > docker-compose.yml \<< 'EOF'
            services:
              test-image:
                build:
                  context: .
                image: lucas42/deploy-orb-test:${VERSION}
            EOF
      - deploy/fetch-publish-creds
      - run:
          name: Override mirror credentials for test registry
          command: |
            echo 'export DOCKER_MIRROR_USERNAME=testmirror' >> "$BASH_ENV"
            echo 'export DOCKER_MIRROR_ACCESS_TOKEN=testpassword' >> "$BASH_ENV"
      - run:
          name: Set test image version
          command: echo "export VERSION=v${CIRCLE_PIPELINE_ID}-mirror" >> $BASH_ENV
      - deploy/publish-docker:
          mirror_url: localhost:5001
          mirror_insecure: true
          remote_docker: false
      - run:
          name: Assert MIRROR_AVAILABLE=true (regression check for #132)
          command: |
            source $BASH_ENV
            if [ "$MIRROR_AVAILABLE" != "true" ]; then
              echo "MIRROR_AVAILABLE is '$MIRROR_AVAILABLE', expected 'true' — probe failed to recognise 401 as available"
              exit 1
            fi
            echo "MIRROR_AVAILABLE=true confirmed"
      - run:
          name: Verify versioned tag was pushed
          command: |
            source $BASH_ENV
            docker buildx imagetools inspect lucas42/deploy-orb-test:${VERSION}
      - run:
          name: Assert plain manifest for default platform="" build (regression check for lucos_deploy_orb#186)
          command: |
            source $BASH_ENV
            docker buildx imagetools inspect lucas42/deploy-orb-test:${VERSION} --raw \
              | jq -e '.mediaType == "application/vnd.docker.distribution.manifest.v2+json"'
      - run:
          name: Verify :latest tag was pushed (main branch only)
          command: |
            if [ "$CIRCLE_BRANCH" != "main" ]; then
              echo "Not on main — skipping :latest verification"
              exit 0
            fi
            source $BASH_ENV
            docker buildx imagetools inspect lucas42/deploy-orb-test:latest

  test-calc-version-patch:
    docker:
      - image: cimg/base:current
    steps:
      - run:
          name: Set up git repo with patch-only commits
          command: |
            git init
            git config user.email "test@circleci.com"
            git config user.name "CircleCI Test"
            git commit --allow-empty -m "chore: initial commit"
            git tag v1.2.3
            git commit --allow-empty -m "fix: a bug fix"
            echo "export CIRCLE_BRANCH=main" >> "$BASH_ENV"
      - deploy/calc-version
      - run:
          name: Assert patch bump (1.2.4)
          command: |
            source "$BASH_ENV"
            [ "$VERSION" = "1.2.4" ] || { echo "FAIL: expected 1.2.4, got $VERSION"; exit 1; }
            echo "PASS: VERSION=$VERSION"

  test-calc-version-minor:
    docker:
      - image: cimg/base:current
    steps:
      - run:
          name: Set up git repo with feat commit
          command: |
            git init
            git config user.email "test@circleci.com"
            git config user.name "CircleCI Test"
            git commit --allow-empty -m "chore: initial commit"
            git tag v1.2.3
            git commit --allow-empty -m "feat: add new feature"
            echo "export CIRCLE_BRANCH=main" >> "$BASH_ENV"
      - deploy/calc-version
      - run:
          name: Assert minor bump (1.3.0)
          command: |
            source "$BASH_ENV"
            [ "$VERSION" = "1.3.0" ] || { echo "FAIL: expected 1.3.0, got $VERSION"; exit 1; }
            echo "PASS: VERSION=$VERSION"

  test-calc-version-major:
    docker:
      - image: cimg/base:current
    steps:
      - run:
          name: Set up git repo with breaking change (feat present too — major must win)
          command: |
            git init
            git config user.email "test@circleci.com"
            git config user.name "CircleCI Test"
            git commit --allow-empty -m "chore: initial commit"
            git tag v1.2.3
            git commit --allow-empty -m "feat: add new feature"
            git commit --allow-empty -m "feat!: breaking rename"
            echo "export CIRCLE_BRANCH=main" >> "$BASH_ENV"
      - deploy/calc-version
      - run:
          name: Assert major bump (2.0.0) beats minor
          command: |
            source "$BASH_ENV"
            [ "$VERSION" = "2.0.0" ] || { echo "FAIL: expected 2.0.0, got $VERSION"; exit 1; }
            echo "PASS: VERSION=$VERSION"

  deploy-log:
    docker:
      - image: cimg/base:current
    steps:
      - run:
          name: Send deploy log to loganne
          command: |
            curl https://loganne.l42.eu/events --data '{
              "type":"publishedOrb",
              "source":"lucos_deploy_orb",
              "systemDeployed":"'"$CIRCLE_PROJECT_REPONAME"'",
              "humanReadable":"Published circleci orb '"$CIRCLE_PROJECT_REPONAME"'"
            }' -H "Content-Type: application/json" --fail

  test-deploy-compose-rollback:
    # Exercises the real deploy/deploy-compose command (lucos_deploy_orb#192) against a
    # local Docker daemon — no SSH/live host needed, since deploy-compose itself never
    # references DOCKER_HOST directly, only whatever the caller already exported.
    machine:
      image: ubuntu-2204:current
    steps:
      - run:
          name: Export test deploy environment
          command: |
            echo "export COMPOSE_PROJECT_NAME=deployorbrollbacktest" >> "$BASH_ENV"
            echo "export HOSTDOMAIN=test-host" >> "$BASH_ENV"
      - run:
          name: Build a healthy image and an always-unhealthy image
          command: |
            mkdir -p good bad
            printf 'FROM alpine:latest\nHEALTHCHECK --interval=1s --retries=1 --start-period=1s CMD true\nCMD ["sleep","3600"]\n' > good/Dockerfile
            printf 'FROM alpine:latest\nHEALTHCHECK --interval=1s --retries=1 --start-period=1s CMD false\nCMD ["sleep","3600"]\n' > bad/Dockerfile
            docker build -t deploy-orb-rollback-test:good good
            docker build -t deploy-orb-rollback-test:bad bad
      - run:
          name: Write test docker-compose.yml
          command: |
            cat > docker-compose.yml \<< 'EOF'
            services:
              app:
                image: deploy-orb-rollback-test:${VERSION}
            EOF
      - run:
          name: Bootstrap the "previously working" deploy (good version)
          command: |
            echo "export VERSION=good" >> "$BASH_ENV"
            source "$BASH_ENV"
            docker compose up -d --no-build --wait --wait-timeout 30
      - run:
          name: Set VERSION for the failing deploy attempt
          command: echo "export VERSION=bad" >> "$BASH_ENV"
      - deploy/deploy-compose
      - run:
          name: Assert deploy reported failure, rollback attempted+succeeded, previous image running
          command: |
            [ "$DEPLOY_SUCCEEDED" = "false" ] || { echo "FAIL: DEPLOY_SUCCEEDED=$DEPLOY_SUCCEEDED, expected false"; exit 1; }
            [ "$ROLLBACK_ATTEMPTED" = "true" ] || { echo "FAIL: ROLLBACK_ATTEMPTED=$ROLLBACK_ATTEMPTED, expected true"; exit 1; }
            [ "$ROLLBACK_STATUS" = "succeeded" ] || { echo "FAIL: ROLLBACK_STATUS=$ROLLBACK_STATUS, expected succeeded"; exit 1; }
            [ "$ROLLED_BACK_TO_VERSION" = "good" ] || { echo "FAIL: rolled back to '$ROLLED_BACK_TO_VERSION', expected 'good'"; exit 1; }
            RUNNING_IMAGE=$(docker inspect --format '{{.Config.Image}}' "$(docker compose ps -aq app)")
            [ "$RUNNING_IMAGE" = "deploy-orb-rollback-test:good" ] || { echo "FAIL: running image is '$RUNNING_IMAGE', expected deploy-orb-rollback-test:good"; exit 1; }
            echo "PASS: failed deploy correctly rolled back to the previously-healthy image, which is running, and the deploy is still reported as failed"

  test-deploy-compose-no-rollback-target:
    # First-ever-deploy case: no prior container exists, so there is nothing to roll back
    # to — assert the deploy still just fails and reports no rollback attempt (today's
    # pre-#192 behaviour, unchanged for this case).
    machine:
      image: ubuntu-2204:current
    steps:
      - run:
          name: Export test deploy environment
          command: |
            echo "export COMPOSE_PROJECT_NAME=deployorbnotargettest" >> "$BASH_ENV"
            echo "export HOSTDOMAIN=test-host" >> "$BASH_ENV"
            echo "export VERSION=bad" >> "$BASH_ENV"
      - run:
          name: Build an always-unhealthy image (no prior good deploy exists)
          command: |
            mkdir -p bad
            printf 'FROM alpine:latest\nHEALTHCHECK --interval=1s --retries=1 --start-period=1s CMD false\nCMD ["sleep","3600"]\n' > bad/Dockerfile
            docker build -t deploy-orb-rollback-test:bad bad
      - run:
          name: Write test docker-compose.yml
          command: |
            cat > docker-compose.yml \<< 'EOF'
            services:
              app:
                image: deploy-orb-rollback-test:${VERSION}
            EOF
      - deploy/deploy-compose
      - run:
          name: Assert deploy reported failure with no rollback attempted (first-ever deploy case)
          command: |
            [ "$DEPLOY_SUCCEEDED" = "false" ] || { echo "FAIL: DEPLOY_SUCCEEDED=$DEPLOY_SUCCEEDED, expected false"; exit 1; }
            [ "$ROLLBACK_ATTEMPTED" = "false" ] || { echo "FAIL: ROLLBACK_ATTEMPTED=$ROLLBACK_ATTEMPTED, expected false (no prior container existed)"; exit 1; }
            echo "PASS: first-ever-deploy failure correctly reports no rollback target, matching pre-existing behaviour"

  test-deploy-compose-rollback-multi-service:
    # Regression test for PR #194 review: a fixed-image sidecar (no ${VERSION} templating,
    # no healthcheck — e.g. lucos_locations' otrecorder) declared BEFORE the ${VERSION}-driven
    # service must never be picked as the rollback-version source. Declaration order here
    # deliberately mirrors that real compose file (sidecar first, app second).
    machine:
      image: ubuntu-2204:current
    steps:
      - run:
          name: Export test deploy environment
          command: |
            echo "export COMPOSE_PROJECT_NAME=deployorbrollbackmultitest" >> "$BASH_ENV"
            echo "export HOSTDOMAIN=test-host" >> "$BASH_ENV"
      - run:
          name: Build a healthy image and an always-unhealthy image
          command: |
            mkdir -p good bad
            printf 'FROM alpine:latest\nHEALTHCHECK --interval=1s --retries=1 --start-period=1s CMD true\nCMD ["sleep","3600"]\n' > good/Dockerfile
            printf 'FROM alpine:latest\nHEALTHCHECK --interval=1s --retries=1 --start-period=1s CMD false\nCMD ["sleep","3600"]\n' > bad/Dockerfile
            docker build -t deploy-orb-rollback-test:good good
            docker build -t deploy-orb-rollback-test:bad bad
      - run:
          name: Write test docker-compose.yml (fixed-image sidecar declared before the app)
          command: |
            cat > docker-compose.yml \<< 'EOF'
            services:
              sidecar:
                image: redis:7-alpine
              app:
                image: deploy-orb-rollback-test:${VERSION}
            EOF
      - run:
          name: Bootstrap the "previously working" deploy (good version)
          command: |
            echo "export VERSION=good" >> "$BASH_ENV"
            source "$BASH_ENV"
            docker compose up -d --no-build --wait --wait-timeout 30
      - run:
          name: Set VERSION for the failing deploy attempt
          command: echo "export VERSION=bad" >> "$BASH_ENV"
      - deploy/deploy-compose
      - run:
          name: Assert rollback picked the version-driven service, not the sidecar declared before it
          command: |
            [ "$DEPLOY_SUCCEEDED" = "false" ] || { echo "FAIL: DEPLOY_SUCCEEDED=$DEPLOY_SUCCEEDED, expected false"; exit 1; }
            [ "$ROLLBACK_ATTEMPTED" = "true" ] || { echo "FAIL: ROLLBACK_ATTEMPTED=$ROLLBACK_ATTEMPTED, expected true"; exit 1; }
            [ "$ROLLBACK_STATUS" = "succeeded" ] || { echo "FAIL: ROLLBACK_STATUS=$ROLLBACK_STATUS, expected succeeded"; exit 1; }
            [ "$ROLLED_BACK_TO_VERSION" = "good" ] || { echo "FAIL: rolled back to '$ROLLED_BACK_TO_VERSION', expected 'good' (got the sidecar's tag instead of the app's?)"; exit 1; }
            RUNNING_IMAGE=$(docker inspect --format '{{.Config.Image}}' "$(docker compose ps -aq app)")
            [ "$RUNNING_IMAGE" = "deploy-orb-rollback-test:good" ] || { echo "FAIL: running image is '$RUNNING_IMAGE', expected deploy-orb-rollback-test:good"; exit 1; }
            echo "PASS: rollback correctly picked the version-driven app service despite the sidecar being declared first"

workflows:
  test-deploy:
    jobs:
      - test-publish-docker
      - test-publish-docker-with-mirror
      - test-calc-version-patch
      - test-calc-version-minor
      - test-calc-version-major
      - test-deploy-compose-rollback
      - test-deploy-compose-no-rollback-target
      - test-deploy-compose-rollback-multi-service
      - orb-tools/pack:
          persist-to-workspace: true
          requires:
            - test-publish-docker
            - test-publish-docker-with-mirror
            - test-calc-version-patch
            - test-calc-version-minor
            - test-calc-version-major
            - test-deploy-compose-rollback
            - test-deploy-compose-no-rollback-target
            - test-deploy-compose-rollback-multi-service
          filters:
            branches:
              only:
                - main
      - orb-tools/increment:
          context: orb-publishing
          orb-ref: lucos/deploy
          attach-workspace: true
          requires:
            - orb-tools/pack
          filters:
            branches:
              only:
                - main
      - deploy-log:
          requires:
            - orb-tools/increment
          filters:
            branches:
              only:
                - main
